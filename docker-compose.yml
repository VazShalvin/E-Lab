services:
  app:
    build: .
    container_name: elab-app
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
    env_file: .env
    volumes:
      - .:/app
      - media:/app/media
      - staticfiles:/app/staticfiles
      - ./sandbox_data:/var/elab-sandbox
      - ${DOCKER_SOCK:-/home/kevin/.docker/desktop/docker.sock}:/var/run/docker.sock
    depends_on:
      - elab-db
      - elab-redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    networks:
      - elab-network

  worker:
    build: .
    container_name: elab-worker
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency 4
    env_file: .env
    volumes:
      - .:/app
      - media:/app/media
      - ./sandbox_data:/var/elab-sandbox
      - ${DOCKER_SOCK:-/home/kevin/.docker/desktop/docker.sock}:/var/run/docker.sock
    depends_on:
      - elab-db
      - elab-redis
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    networks:
      - elab-network

  elab-db:
    image: postgres:15-alpine
    container_name: elab-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - elab-network

  elab-redis:
    image: redis:7-alpine
    container_name: elab-redis
    restart: unless-stopped
    networks:
      - elab-network

  nginx:
    image: nginx:1.27-alpine
    container_name: elab-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
      - staticfiles:/var/www/static
      - media:/var/www/media
    depends_on:
      - app
    networks:
      - elab-network

volumes:
  postgres_data:
  media:
  staticfiles:

networks:
  elab-network:
    driver: bridge
